name: CallForwarder
options:
  bundleIdPrefix: com.callforwarder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  CallForwarder:
    type: application
    platform: iOS
    sources:
      - path: CallForwarder
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callforwarder.app
        INFOPLIST_FILE: CallForwarder/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: CallForwarderWidget
        embed: true

  CallForwarderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CallForwarderWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callforwarder.app.CallForwarderWidget
        INFOPLIST_FILE: CallForwarderWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
